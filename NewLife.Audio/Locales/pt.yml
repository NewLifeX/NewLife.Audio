"Not a Vorbis comment header.": "Não é um cabeçalho de comentário Vorbis."
"Not a Vorbis setup header.": "Não é um cabeçalho de configuração Vorbis."
"Vorbis version {0} is not supported.": "A versão Vorbis {0} não é suportada."
"No codec is registered for [{0}].": "Nenhum codec está registrado para [{0}]."
"Unsupported container format: {0}.": "Formato de contêiner não suportado: {0}."
