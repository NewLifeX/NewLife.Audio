"Vorbis version {0} is not supported.": "Η έκδοση Vorbis {0} δεν υποστηρίζεται."
"No codec is registered for [{0}].": "Δεν έχει καταχωρηθεί κωδικοποιητής για [{0}]."
"Unsupported container format: {0}.": "Μη υποστηριζόμενη μορφή κοντέινερ: {0}."
