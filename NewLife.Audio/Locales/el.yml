# Ελληνικά 词表（el）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"The data is shorter than 2 bytes.": "Τα δεδομένα είναι μικρότερα από 2 byte."
"The data is too short to contain a FLAC marker.": "Τα δεδομένα είναι πολύ σύντομα για να περιέχουν δείκτη FLAC."
"Not valid FLAC data.": "Μη έγκυρα δεδομένα FLAC."
