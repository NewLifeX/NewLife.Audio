"Not a valid WAV file.": "Μη έγκυρο αρχείο WAV."
"An RTP packet requires at least a 12-byte header.": "Ένα πακέτο RTP απαιτεί κεφαλίδα τουλάχιστον 12 byte."
"The pipe has been closed.": "Ο σωλήνας έχει κλείσει."
"No audio backend is available.": "Δεν υπάρχει διαθέσιμο backend ήχου."
