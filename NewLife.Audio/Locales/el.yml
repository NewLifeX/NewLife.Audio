"The bit count must be between 2 and 5.": "Ο αριθμός bit πρέπει να είναι μεταξύ 2 και 5."
"Vorbis data is too short.": "Τα δεδομένα Vorbis είναι πολύ σύντομα."
"Not a Vorbis identification header.": "Δεν είναι κεφαλίδα αναγνώρισης Vorbis."
