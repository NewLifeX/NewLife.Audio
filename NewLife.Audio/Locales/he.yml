# עברית 词表（he）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"The data is shorter than 2 bytes.": "הנתונים קצרים מ-2 בתים."
"The data is too short to contain a FLAC marker.": "הנתונים קצרים מדי כדי להכיל סמן FLAC."
"Not valid FLAC data.": "נתוני FLAC לא חוקיים."
"No STREAMINFO metadata block was found in the FLAC data.": "לא נמצא בלוק מטא-נתונים STREAMINFO בנתוני FLAC."
"The bit count must be between 2 and 5.": "מספר הביטים חייב להיות בין 2 ל-5."
"Vorbis data is too short.": "נתוני Vorbis קצרים מדי."
"Not a Vorbis identification header.": "זה אינו כותרת זיהוי Vorbis."
"Not valid Vorbis data.": "נתוני Vorbis לא חוקיים."
"Not a Vorbis comment header.": "זה אינו כותרת הערות Vorbis."
