# Español 词表（es）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"The data is shorter than 2 bytes.": "Los datos son más cortos que 2 bytes."
"The data is too short to contain a FLAC marker.": "Los datos son demasiado cortos para contener un marcador FLAC."
"Not valid FLAC data.": "No son datos FLAC válidos."
"No STREAMINFO metadata block was found in the FLAC data.": "No se encontró ningún bloque de metadatos STREAMINFO en los datos FLAC."
"The bit count must be between 2 and 5.": "El número de bits debe estar entre 2 y 5."
"Vorbis data is too short.": "Los datos de Vorbis son demasiado cortos."
"Not a Vorbis identification header.": "No es una cabecera de identificación de Vorbis."
"Not valid Vorbis data.": "No son datos de Vorbis válidos."
"Not a Vorbis comment header.": "No es una cabecera de comentario de Vorbis."
"Not a Vorbis setup header.": "No es una cabecera de configuración de Vorbis."
"Vorbis version {0} is not supported.": "La versión de Vorbis {0} no es compatible."
"No codec is registered for [{0}].": "No hay ningún códec registrado para [{0}]."
"Unsupported container format: {0}.": "Formato de contenedor no compatible: {0}."
"Not a valid FLAC file.": "No es un archivo FLAC válido."
"The MP4 file has been finalized and cannot accept more frames.": "El archivo MP4 se ha finalizado y no puede aceptar más fotogramas."
"Unable to read an OGG page.": "No se pudo leer una página OGG."
"Not a valid WAV file.": "No es un archivo WAV válido."
"An RTP packet requires at least a 12-byte header.": "Un paquete RTP requiere una cabecera de al menos 12 bytes."
"The pipe has been closed.": "La tubería se ha cerrado."
"No audio backend is available.": "No hay ningún backend de audio disponible."
