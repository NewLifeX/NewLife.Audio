"NewLife Audio Library": "Biblioteca de audio NewLife"
"Cross-platform, pure-managed .NET audio library: codecs (G.711/G.722/G.726/ADPCM/Opus/MP3/AAC/FLAC/Vorbis/Speex), device I/O (WaveOut/WASAPI/ASIO), DSP effects, speech processing (VAD/AEC/AGC/NS), container formats (WAV/Ogg/MP4/FLAC) and streaming (RTP/RTSP/HTTP/WebSocket). NativeAOT-ready, with built-in runtime localization for 31 languages; targets 3 frameworks from .NET Framework 4.6.1 to .NET Standard 2.1.": "Biblioteca de audio .NET multiplataforma y totalmente administrada: códecs (G.711/G.722/G.726/ADPCM/Opus/MP3/AAC/FLAC/Vorbis/Speex), E/S de dispositivos (WaveOut/WASAPI/ASIO), efectos DSP, procesamiento de voz (VAD/AEC/AGC/NS), formatos de contenedor (WAV/Ogg/MP4/FLAC) y streaming (RTP/RTSP/HTTP/WebSocket). Compatible con NativeAOT, con localización en tiempo de ejecución integrada para 31 idiomas; admite 3 plataformas de destino desde .NET Framework 4.6.1 hasta .NET Standard 2.1."
