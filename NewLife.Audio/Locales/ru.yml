# Русский 词表（ru）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"The data is shorter than 2 bytes.": "Данные короче 2 байт."
"The data is too short to contain a FLAC marker.": "Данные слишком коротки, чтобы содержать маркер FLAC."
"Not valid FLAC data.": "Недопустимые данные FLAC."
"No STREAMINFO metadata block was found in the FLAC data.": "В данных FLAC не найден блок метаданных STREAMINFO."
"The bit count must be between 2 and 5.": "Число бит должно быть от 2 до 5."
"Vorbis data is too short.": "Данные Vorbis слишком коротки."
"Not a Vorbis identification header.": "Это не заголовок идентификации Vorbis."
"Not valid Vorbis data.": "Недопустимые данные Vorbis."
"Not a Vorbis comment header.": "Это не заголовок комментария Vorbis."
"Not a Vorbis setup header.": "Это не заголовок настройки Vorbis."
"Vorbis version {0} is not supported.": "Версия Vorbis {0} не поддерживается."
"No codec is registered for [{0}].": "Для [{0}] не зарегистрирован кодек."
"Unsupported container format: {0}.": "Неподдерживаемый формат контейнера: {0}."
"Not a valid FLAC file.": "Недопустимый файл FLAC."
"The MP4 file has been finalized and cannot accept more frames.": "Файл MP4 завершён и не может принимать новые кадры."
"Unable to read an OGG page.": "Не удалось прочитать страницу OGG."
"Not a valid WAV file.": "Недопустимый файл WAV."
"An RTP packet requires at least a 12-byte header.": "Пакет RTP требует заголовка не менее 12 байт."
"The pipe has been closed.": "Канал закрыт."
"No audio backend is available.": "Доступный аудиобэкенд отсутствует."
