# Polski 词表（pl）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"The data is shorter than 2 bytes.": "Dane są krótsze niż 2 bajty."
"The data is too short to contain a FLAC marker.": "Dane są zbyt krótkie, aby zawierać znacznik FLAC."
"Not valid FLAC data.": "Nieprawidłowe dane FLAC."
"No STREAMINFO metadata block was found in the FLAC data.": "Nie znaleziono bloku metadanych STREAMINFO w danych FLAC."
"The bit count must be between 2 and 5.": "Liczba bitów musi mieścić się w zakresie od 2 do 5."
"Vorbis data is too short.": "Dane Vorbis są zbyt krótkie."
"Not a Vorbis identification header.": "To nie jest nagłówek identyfikacyjny Vorbis."
"Not valid Vorbis data.": "Nieprawidłowe dane Vorbis."
"Not a Vorbis comment header.": "To nie jest nagłówek komentarza Vorbis."
"Not a Vorbis setup header.": "To nie jest nagłówek konfiguracji Vorbis."
"Vorbis version {0} is not supported.": "Wersja Vorbis {0} nie jest obsługiwana."
"No codec is registered for [{0}].": "Nie zarejestrowano kodeka dla [{0}]."
"Unsupported container format: {0}.": "Nieobsługiwany format kontenera: {0}."
"Not a valid FLAC file.": "Nieprawidłowy plik FLAC."
"The MP4 file has been finalized and cannot accept more frames.": "Plik MP4 został sfinalizowany i nie może przyjmować kolejnych ramek."
"Unable to read an OGG page.": "Nie można odczytać strony OGG."
"Not a valid WAV file.": "Nieprawidłowy plik WAV."
"An RTP packet requires at least a 12-byte header.": "Pakiet RTP wymaga nagłówka o długości co najmniej 12 bajtów."
"The pipe has been closed.": "Potok został zamknięty."
"No audio backend is available.": "Brak dostępnego backendu audio."
"No ASIO driver is installed; the device list is a placeholder.": "Nie zainstalowano sterownika ASIO; lista urządzeń jest atrapą."
"Failed to start the capture thread: {0}": "Nie udało się uruchomić wątku przechwytywania: {0}"
"waveOutOpen returned {0}; falling back to the null player.": "waveOutOpen zwrócił {0}; powrót do pustego odtwarzacza."
"ASIO default device (no driver detected)": "Domyślne urządzenie ASIO (nie wykryto sterownika)"
"ASIO default device (no driver installed)": "Domyślne urządzenie ASIO (sterownik nie jest zainstalowany)"
"WASAPI default output": "Domyślne wyjście WASAPI"
"WASAPI default input": "Domyślne wejście WASAPI"
"Default audio device": "Domyślne urządzenie audio"
"Default recording device": "Domyślne urządzenie nagrywające"
"Default device": "Domyślne urządzenie"
"DESCRIBE returned {0} {1}": "DESCRIBE zwrócił {0} {1}"
"Failed to set the FAAC configuration.": "Nie udało się ustawić konfiguracji FAAC."
"Error in BytesToStruct: {0}": "Błąd w BytesToStruct: {0}"
"Error in StructToBytes: {0}": "Błąd w StructToBytes: {0}"
