"NewLife Audio Library": "Бібліотека аудіо NewLife"
"Cross-platform, pure-managed .NET audio library: codecs (G.711/G.722/G.726/ADPCM/Opus/MP3/AAC/FLAC/Vorbis/Speex), device I/O (WaveOut/WASAPI/ASIO), DSP effects, speech processing (VAD/AEC/AGC/NS), container formats (WAV/Ogg/MP4/FLAC) and streaming (RTP/RTSP/HTTP/WebSocket). NativeAOT-ready, with built-in runtime localization for 31 languages; targets 3 frameworks from .NET Framework 4.6.1 to .NET Standard 2.1.": "Кросплатформна, повністю керована аудіобібліотека .NET: кодеки (G.711/G.722/G.726/ADPCM/Opus/MP3/AAC/FLAC/Vorbis/Speex), введення-виведення пристроїв (WaveOut/WASAPI/ASIO), DSP-ефекти, обробка мовлення (VAD/AEC/AGC/NS), формати контейнерів (WAV/Ogg/MP4/FLAC) і потокове передавання (RTP/RTSP/HTTP/WebSocket). Готова до NativeAOT, із вбудованою локалізацією часу виконання для 31 мови; підтримує 3 фреймворки: від .NET Framework 4.6.1 до .NET Standard 2.1."
