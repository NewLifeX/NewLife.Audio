# 日本語 词表（ja）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"The data is shorter than 2 bytes.": "データが 2 バイト未満です。"
"The data is too short to contain a FLAC marker.": "データが短すぎて FLAC マーカーが含まれていません。"
"Not valid FLAC data.": "有効な FLAC データではありません。"
"No STREAMINFO metadata block was found in the FLAC data.": "FLAC データに STREAMINFO メタデータブロックが見つかりません。"
"The bit count must be between 2 and 5.": "ビット数は 2 ～ 5 の範囲である必要があります。"
"Vorbis data is too short.": "Vorbis データが短すぎます。"
"Not a Vorbis identification header.": "Vorbis 識別ヘッダーではありません。"
"Not valid Vorbis data.": "有効な Vorbis データではありません。"
"Not a Vorbis comment header.": "Vorbis コメントヘッダーではありません。"
"Not a Vorbis setup header.": "Vorbis セットアップヘッダーではありません。"
"Vorbis version {0} is not supported.": "Vorbis バージョン {0} はサポートされていません。"
"No codec is registered for [{0}].": "[{0}] に登録されたコーデックがありません。"
"Unsupported container format: {0}.": "サポートされていないコンテナ形式です: {0}。"
"Not a valid FLAC file.": "有効な FLAC ファイルではありません。"
"The MP4 file has been finalized and cannot accept more frames.": "MP4 ファイルはファイナライズ済みのため、これ以上フレームを受け付けられません。"
"Unable to read an OGG page.": "OGG ページを読み取れませんでした。"
"Not a valid WAV file.": "有効な WAV ファイルではありません。"
"An RTP packet requires at least a 12-byte header.": "RTP パケットには少なくとも 12 バイトのヘッダーが必要です。"
"The pipe has been closed.": "パイプは既に閉じられています。"
"No audio backend is available.": "利用可能なオーディオバックエンドがありません。"
"No ASIO driver is installed; the device list is a placeholder.": "ASIO ドライバーがインストールされていません。デバイス一覧はプレースホルダーです。"
"Failed to start the capture thread: {0}": "キャプチャ スレッドを開始できませんでした: {0}"
"waveOutOpen returned {0}; falling back to the null player.": "waveOutOpen が {0} を返しました。Null プレーヤーにフォールバックします。"
"ASIO default device (no driver detected)": "ASIO 既定のデバイス（ドライバー未検出）"
"ASIO default device (no driver installed)": "ASIO 既定のデバイス（ドライバー未インストール）"
"WASAPI default output": "WASAPI 既定の出力"
"WASAPI default input": "WASAPI 既定の入力"
"Default audio device": "既定のオーディオ デバイス"
"Default recording device": "既定の録音デバイス"
"Default device": "既定のデバイス"
"DESCRIBE returned {0} {1}": "DESCRIBE が {0} {1} を返しました"
"Failed to set the FAAC configuration.": "FAAC 構成の設定に失敗しました。"
"Error in BytesToStruct: {0}": "BytesToStruct でエラーが発生しました: {0}"
"Error in StructToBytes: {0}": "StructToBytes でエラーが発生しました: {0}"
