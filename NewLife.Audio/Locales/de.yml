# Deutsch 词表（de）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"The data is shorter than 2 bytes.": "Die Daten sind kürzer als 2 Byte."
"The data is too short to contain a FLAC marker.": "Die Daten sind zu kurz, um eine FLAC-Markierung zu enthalten."
"Not valid FLAC data.": "Keine gültigen FLAC-Daten."
"No STREAMINFO metadata block was found in the FLAC data.": "Im FLAC-Datenblock wurde kein STREAMINFO-Metadatenblock gefunden."
"The bit count must be between 2 and 5.": "Die Bitanzahl muss zwischen 2 und 5 liegen."
"Vorbis data is too short.": "Die Vorbis-Daten sind zu kurz."
"Not a Vorbis identification header.": "Kein Vorbis-Identifikationsheader."
"Not valid Vorbis data.": "Keine gültigen Vorbis-Daten."
"Not a Vorbis comment header.": "Kein Vorbis-Kommentarheader."
"Not a Vorbis setup header.": "Kein Vorbis-Setup-Header."
"Vorbis version {0} is not supported.": "Vorbis-Version {0} wird nicht unterstützt."
"No codec is registered for [{0}].": "Für [{0}] ist kein Codec registriert."
"Unsupported container format: {0}.": "Nicht unterstütztes Containerformat: {0}."
"Not a valid FLAC file.": "Keine gültige FLAC-Datei."
"The MP4 file has been finalized and cannot accept more frames.": "Die MP4-Datei wurde abgeschlossen und kann keine weiteren Frames aufnehmen."
"Unable to read an OGG page.": "Eine OGG-Seite konnte nicht gelesen werden."
"Not a valid WAV file.": "Keine gültige WAV-Datei."
"An RTP packet requires at least a 12-byte header.": "Ein RTP-Paket benötigt mindestens einen 12-Byte-Header."
"The pipe has been closed.": "Die Pipe wurde geschlossen."
"No audio backend is available.": "Kein Audiobackend verfügbar."
