"NewLife Audio Library": "NewLife-Audio-Bibliothek"
"Cross-platform, pure-managed .NET audio library: codecs (G.711/G.722/G.726/ADPCM/Opus/MP3/AAC/FLAC/Vorbis/Speex), device I/O (WaveOut/WASAPI/ASIO), DSP effects, speech processing (VAD/AEC/AGC/NS), container formats (WAV/Ogg/MP4/FLAC) and streaming (RTP/RTSP/HTTP/WebSocket). NativeAOT-ready, with built-in runtime localization for 31 languages; targets 3 frameworks from .NET Framework 4.6.1 to .NET Standard 2.1.": "Plattformübergreifende, vollständig verwaltete .NET-Audiobibliothek: Codecs (G.711/G.722/G.726/ADPCM/Opus/MP3/AAC/FLAC/Vorbis/Speex), Geräte-E/A (WaveOut/WASAPI/ASIO), DSP-Effekte, Sprachverarbeitung (VAD/AEC/AGC/NS), Containerformate (WAV/Ogg/MP4/FLAC) und Streaming (RTP/RTSP/HTTP/WebSocket). NativeAOT-bereit, mit integrierter Laufzeitlokalisierung für 31 Sprachen; unterstützt 3 Zielframeworks von .NET Framework 4.6.1 bis .NET Standard 2.1."
