# العربية 词表（ar）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"The data is shorter than 2 bytes.": "البيانات أقصر من بايتين."
"The data is too short to contain a FLAC marker.": "البيانات قصيرة جدًا لاحتواء علامة FLAC."
"Not valid FLAC data.": "ليست بيانات FLAC صالحة."
"No STREAMINFO metadata block was found in the FLAC data.": "لم يتم العثور على كتلة بيانات STREAMINFO في بيانات FLAC."
"The bit count must be between 2 and 5.": "يجب أن يكون عدد البتات بين 2 و5."
"Vorbis data is too short.": "بيانات Vorbis قصيرة جدًا."
"Not a Vorbis identification header.": "ليست ترويسة تعريف Vorbis."
"Not valid Vorbis data.": "ليست بيانات Vorbis صالحة."
"Not a Vorbis comment header.": "ليست ترويسة تعليق Vorbis."
"Not a Vorbis setup header.": "ليست ترويسة إعداد Vorbis."
"Vorbis version {0} is not supported.": "إصدار Vorbis {0} غير مدعوم."
"No codec is registered for [{0}].": "لا يوجد برنامج ترميز مسجل لـ [{0}]."
"Unsupported container format: {0}.": "تنسيق حاوية غير مدعوم: {0}."
"Not a valid FLAC file.": "ليس ملف FLAC صالحًا."
"The MP4 file has been finalized and cannot accept more frames.": "تم إنهاء ملف MP4 ولا يمكنه قبول المزيد من الإطارات."
"Unable to read an OGG page.": "تعذّرت قراءة صفحة OGG."
"Not a valid WAV file.": "ليس ملف WAV صالحًا."
"An RTP packet requires at least a 12-byte header.": "تتطلب حزمة RTP ترويسة لا تقل عن 12 بايت."
"The pipe has been closed.": "تم إغلاق الأنبوب."
"No audio backend is available.": "لا يوجد خلفية صوتية متاحة."
