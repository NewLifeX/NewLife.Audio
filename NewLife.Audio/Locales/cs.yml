"Unable to read an OGG page.": "Nelze přečíst stránku OGG."
"Not a valid WAV file.": "Neplatný soubor WAV."
"An RTP packet requires at least a 12-byte header.": "Paket RTP vyžaduje alespoň 12bajtovou hlavičku."
"The pipe has been closed.": "Roura byla uzavřena."
"No audio backend is available.": "Není k dispozici žádný zvukový backend."
