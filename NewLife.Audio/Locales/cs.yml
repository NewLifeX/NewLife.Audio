"NewLife Audio Library": "Zvuková knihovna NewLife"
"Cross-platform, pure-managed .NET audio library: codecs (G.711/G.722/G.726/ADPCM/Opus/MP3/AAC/FLAC/Vorbis/Speex), device I/O (WaveOut/WASAPI/ASIO), DSP effects, speech processing (VAD/AEC/AGC/NS), container formats (WAV/Ogg/MP4/FLAC) and streaming (RTP/RTSP/HTTP/WebSocket). NativeAOT-ready, with built-in runtime localization for 31 languages; targets 3 frameworks from .NET Framework 4.6.1 to .NET Standard 2.1.": "Víceplatformní, plně spravovaná zvuková knihovna .NET: kodeky (G.711/G.722/G.726/ADPCM/Opus/MP3/AAC/FLAC/Vorbis/Speex), I/O zařízení (WaveOut/WASAPI/ASIO), efekty DSP, zpracování řeči (VAD/AEC/AGC/NS), kontejnerové formáty (WAV/Ogg/MP4/FLAC) a streamování (RTP/RTSP/HTTP/WebSocket). Připraveno pro NativeAOT, s vestavěnou lokalizací za běhu pro 31 jazyků; cílí na 3 platformy od .NET Framework 4.6.1 po .NET Standard 2.1."
