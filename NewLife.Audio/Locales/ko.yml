# 한국어 词表（ko）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"The data is shorter than 2 bytes.": "데이터가 2바이트보다 짧습니다."
"The data is too short to contain a FLAC marker.": "데이터가 너무 짧아 FLAC 마커를 포함하지 않습니다."
"Not valid FLAC data.": "유효한 FLAC 데이터가 아닙니다."
"No STREAMINFO metadata block was found in the FLAC data.": "FLAC 데이터에서 STREAMINFO 메타데이터 블록을 찾지 못했습니다."
"The bit count must be between 2 and 5.": "비트 수는 2에서 5 사이여야 합니다."
"Vorbis data is too short.": "Vorbis 데이터가 너무 짧습니다."
"Not a Vorbis identification header.": "Vorbis 식별 헤더가 아닙니다."
"Not valid Vorbis data.": "유효한 Vorbis 데이터가 아닙니다."
"Not a Vorbis comment header.": "Vorbis 주석 헤더가 아닙니다."
"Not a Vorbis setup header.": "Vorbis 설정 헤더가 아닙니다."
"Vorbis version {0} is not supported.": "Vorbis 버전 {0}은(는) 지원되지 않습니다."
"No codec is registered for [{0}].": "[{0}]에 등록된 코덱이 없습니다."
"Unsupported container format: {0}.": "지원되지 않는 컨테이너 형식입니다: {0}."
"Not a valid FLAC file.": "유효한 FLAC 파일이 아닙니다."
"The MP4 file has been finalized and cannot accept more frames.": "MP4 파일이 마무리되어 더 이상 프레임을 받을 수 없습니다."
"Unable to read an OGG page.": "OGG 페이지를 읽을 수 없습니다."
"Not a valid WAV file.": "유효한 WAV 파일이 아닙니다."
"An RTP packet requires at least a 12-byte header.": "RTP 패킷에는 최소 12바이트 헤더가 필요합니다."
"The pipe has been closed.": "파이프가 닫혔습니다."
"No audio backend is available.": "사용 가능한 오디오 백엔드가 없습니다."
