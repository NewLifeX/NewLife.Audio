"NewLife Audio Library": "کتابخانه صوتی NewLife"
"Cross-platform, pure-managed .NET audio library: codecs (G.711/G.722/G.726/ADPCM/Opus/MP3/AAC/FLAC/Vorbis/Speex), device I/O (WaveOut/WASAPI/ASIO), DSP effects, speech processing (VAD/AEC/AGC/NS), container formats (WAV/Ogg/MP4/FLAC) and streaming (RTP/RTSP/HTTP/WebSocket). NativeAOT-ready, with built-in runtime localization for 31 languages; targets 3 frameworks from .NET Framework 4.6.1 to .NET Standard 2.1.": "کتابخانه صوتی .NET چندسکویی و کاملاً مدیریت‌شده: کدک‌ها (G.711/G.722/G.726/ADPCM/Opus/MP3/AAC/FLAC/Vorbis/Speex)، ورودی/خروجی دستگاه‌ها (WaveOut/WASAPI/ASIO)، جلوه‌های DSP، پردازش گفتار (VAD/AEC/AGC/NS)، قالب‌های ظرف (WAV/Ogg/MP4/FLAC) و پخش جریانی (RTP/RTSP/HTTP/WebSocket). آماده برای NativeAOT، با بومی‌سازی داخلی زمان اجرا برای ۳۱ زبان؛ ۳ چارچوب را از .NET Framework 4.6.1 تا .NET Standard 2.1 هدف می‌گیرد."
