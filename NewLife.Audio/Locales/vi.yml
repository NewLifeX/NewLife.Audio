"NewLife Audio Library": "Thư viện NewLife Audio"
"Cross-platform, pure-managed .NET audio library: codecs (G.711/G.722/G.726/ADPCM/Opus/MP3/AAC/FLAC/Vorbis/Speex), device I/O (WaveOut/WASAPI/ASIO), DSP effects, speech processing (VAD/AEC/AGC/NS), container formats (WAV/Ogg/MP4/FLAC) and streaming (RTP/RTSP/HTTP/WebSocket). NativeAOT-ready, with built-in runtime localization for 31 languages; targets 3 frameworks from .NET Framework 4.6.1 to .NET Standard 2.1.": "Thư viện âm thanh .NET thuần được quản lý, đa nền tảng: bộ mã hóa/giải mã (G.711/G.722/G.726/ADPCM/Opus/MP3/AAC/FLAC/Vorbis/Speex), I/O thiết bị (WaveOut/WASAPI/ASIO), hiệu ứng DSP, xử lý giọng nói (VAD/AEC/AGC/NS), định dạng vùng chứa (WAV/Ogg/MP4/FLAC) và truyền phát trực tuyến (RTP/RTSP/HTTP/WebSocket). Sẵn sàng cho NativeAOT, tích hợp bản địa hóa lúc chạy cho 31 ngôn ngữ; hỗ trợ 3 khung đích từ .NET Framework 4.6.1 đến .NET Standard 2.1."
