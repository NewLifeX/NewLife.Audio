"NewLife Audio Library": "NewLife hangkönyvtár"
"Cross-platform, pure-managed .NET audio library: codecs (G.711/G.722/G.726/ADPCM/Opus/MP3/AAC/FLAC/Vorbis/Speex), device I/O (WaveOut/WASAPI/ASIO), DSP effects, speech processing (VAD/AEC/AGC/NS), container formats (WAV/Ogg/MP4/FLAC) and streaming (RTP/RTSP/HTTP/WebSocket). NativeAOT-ready, with built-in runtime localization for 31 languages; targets 3 frameworks from .NET Framework 4.6.1 to .NET Standard 2.1.": "Platformfüggetlen, teljesen felügyelt .NET hangkönyvtár: kodekek (G.711/G.722/G.726/ADPCM/Opus/MP3/AAC/FLAC/Vorbis/Speex), eszköz I/O (WaveOut/WASAPI/ASIO), DSP-effektek, beszédfeldolgozás (VAD/AEC/AGC/NS), tárolóformátumok (WAV/Ogg/MP4/FLAC) és streamelés (RTP/RTSP/HTTP/WebSocket). NativeAOT-kompatibilis, 31 nyelv beépített futásidejű lokalizációjával; 3 keretrendszert céloz a .NET Framework 4.6.1-től a .NET Standard 2.1-ig."
