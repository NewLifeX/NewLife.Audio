"NewLife Audio Library": "NewLife-lydbibliotek"
"Cross-platform, pure-managed .NET audio library: codecs (G.711/G.722/G.726/ADPCM/Opus/MP3/AAC/FLAC/Vorbis/Speex), device I/O (WaveOut/WASAPI/ASIO), DSP effects, speech processing (VAD/AEC/AGC/NS), container formats (WAV/Ogg/MP4/FLAC) and streaming (RTP/RTSP/HTTP/WebSocket). NativeAOT-ready, with built-in runtime localization for 31 languages; targets 3 frameworks from .NET Framework 4.6.1 to .NET Standard 2.1.": "Plattformuavhengig, fullstendig administrert .NET-lydbibliotek: kodeker (G.711/G.722/G.726/ADPCM/Opus/MP3/AAC/FLAC/Vorbis/Speex), enhets-I/O (WaveOut/WASAPI/ASIO), DSP-effekter, taleprosessering (VAD/AEC/AGC/NS), containerformater (WAV/Ogg/MP4/FLAC) og strømming (RTP/RTSP/HTTP/WebSocket). Klar for NativeAOT, med innebygd kjøretidslokalisering for 31 språk; støtter 3 rammeverk fra .NET Framework 4.6.1 til .NET Standard 2.1."
