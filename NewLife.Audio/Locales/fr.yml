# Français 词表（fr）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"The data is shorter than 2 bytes.": "Les données font moins de 2 octets."
"The data is too short to contain a FLAC marker.": "Les données sont trop courtes pour contenir un marqueur FLAC."
"Not valid FLAC data.": "Ce ne sont pas des données FLAC valides."
"No STREAMINFO metadata block was found in the FLAC data.": "Aucun bloc de métadonnées STREAMINFO n'a été trouvé dans les données FLAC."
"The bit count must be between 2 and 5.": "Le nombre de bits doit être compris entre 2 et 5."
"Vorbis data is too short.": "Les données Vorbis sont trop courtes."
"Not a Vorbis identification header.": "Ce n'est pas un en-tête d'identification Vorbis."
"Not valid Vorbis data.": "Ce ne sont pas des données Vorbis valides."
"Not a Vorbis comment header.": "Ce n'est pas un en-tête de commentaire Vorbis."
"Not a Vorbis setup header.": "Ce n'est pas un en-tête de configuration Vorbis."
"Vorbis version {0} is not supported.": "La version Vorbis {0} n'est pas prise en charge."
"No codec is registered for [{0}].": "Aucun codec n'est enregistré pour [{0}]."
"Unsupported container format: {0}.": "Format de conteneur non pris en charge : {0}."
"Not a valid FLAC file.": "Ce n'est pas un fichier FLAC valide."
"The MP4 file has been finalized and cannot accept more frames.": "Le fichier MP4 a été finalisé et ne peut plus accepter d'images."
"Unable to read an OGG page.": "Impossible de lire une page OGG."
"Not a valid WAV file.": "Ce n'est pas un fichier WAV valide."
"An RTP packet requires at least a 12-byte header.": "Un paquet RTP nécessite un en-tête d'au moins 12 octets."
"The pipe has been closed.": "Le tube a été fermé."
"No audio backend is available.": "Aucun backend audio n'est disponible."
