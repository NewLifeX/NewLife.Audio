name: test

# 多 RID 单元测试矩阵：win-x64 / linux-x64 / linux-arm64 / linux-la64（龙芯）。
# 触发：push / pull_request / 手动（workflow_dispatch）；不采用夜间定时。
# linux-la64 无托管 runner，使用 QEMU 用户态仿真 + 龙芯 .NET SDK（github.com/loongson/dotnet），
# 载体为 ghcr.io/loong64/debian:trixie 容器（loong64 社区移植镜像）；宿主完成构建，容器内仅执行测试。
# 本库单元测试不依赖外部服务（MySQL/Redis/RocketMQ 等），无需在 CI 中安装。

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 全解决方案编译校验：覆盖 netstandard2.0 / netstandard2.1 / net461（核心库）、net10.0（测试/客户端/AOT 冒烟）
  build:
    name: build solution
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          10.x
    - name: Build
      run: dotnet build NewLife.Audio.slnx -c Release

  # win-x64：原生 runner 直接运行单元测试
  test-win-x64:
    name: test (win-x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          10.x
    - name: Test
      run: dotnet test XUnitTest\XUnitTest.csproj -c Release -- --report-trx --report-trx-filename test-win-x64.trx --results-directory TestResults
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-win-x64
        path: TestResults/**
        if-no-files-found: ignore

  # linux-x64：原生 runner 直接运行单元测试
  test-linux-x64:
    name: test (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          10.x
    - name: Test
      run: dotnet test XUnitTest/XUnitTest.csproj -c Release -- --report-trx --report-trx-filename test-linux-x64.trx --results-directory TestResults
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-linux-x64
        path: TestResults/**
        if-no-files-found: ignore

  # linux-arm64：GitHub 官方 arm64 runner
  test-linux-arm64:
    name: test (linux-arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          10.x
    - name: Test
      run: dotnet test XUnitTest/XUnitTest.csproj -c Release -- --report-trx --report-trx-filename test-linux-arm64.trx --results-directory TestResults
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-linux-arm64
        path: TestResults/**
        if-no-files-found: ignore

  # linux-la64（龙芯）：QEMU 用户态仿真 + 龙芯 SDK + loong64 Debian 容器。
  # 测试项目为 xUnit v3 独立可执行程序（MTP），构建在宿主 x64 SDK 完成，容器内直接用 dotnet 执行。
  test-linux-la64:
    name: test (linux-la64 / QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET (host，用于构建)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          10.x
    - name: Build for loong64 (host，QEMU 内不跑 MSBuild)
      run: dotnet build XUnitTest/XUnitTest.csproj -c Release
    - name: Download Loongson .NET SDK (linux-loongarch64)
      run: |
        curl -fL --retry 3 -o "$RUNNER_TEMP/la64-sdk.tar.gz" \
          https://github.com/loongson/dotnet/releases/download/v10.0.113-loongarch64/dotnet-sdk-10.0.113-linux-loongarch64.tar.gz
        mkdir -p "$HOME/la64" && tar -xzf "$RUNNER_TEMP/la64-sdk.tar.gz" -C "$HOME/la64"
        chmod +x "$HOME/la64/dotnet" || true
        ls "$HOME/la64" | head -20
    - name: Install QEMU loong64 binfmt
      run: docker run --privileged --rm ghcr.io/loong64/binfmt --install all
    - name: Unit Tests (loong64 container)
      run: |
        docker run --rm --platform linux/loong64 -w /src \
          -v "$PWD:/src" -v "$HOME/la64:/opt/dotnet:ro" -v "$HOME/.nuget:/home/runner/.nuget" \
          -e HOME=/home/runner -e DOTNET_CLI_HOME=/home/runner -e NUGET_PACKAGES=/home/runner/.nuget/packages \
          -e DOTNET_ROOT=/opt/dotnet -e PATH=/opt/dotnet:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
          -e DOTNET_CLI_TELEMETRY_OPTOUT=1 -e DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 \
          -e DOTNET_ROLL_FORWARD=LatestMajor -e DOTNET_EnableWriteXorExecute=0 \
          ghcr.io/loong64/debian:trixie bash -c '
            set -e
            apt-get update -qq || true
            apt-get install -y -qq ca-certificates libstdc++6 zlib1g libunwind8 || true
            apt-get install -y -qq libssl3t64 || apt-get install -y -qq libssl3 || true
            dotnet --info
            mkdir -p /src/TestResults
            cd /src/Bin/UnitTest/net10.0
            timeout 150m dotnet XUnitTest.dll -parallelMode none -result-xml /src/TestResults/test-linux-la64.xml
          '
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-linux-la64
        path: TestResults/*.xml
        if-no-files-found: ignore

  localization:
    name: localization checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    - name: Check locales
      shell: pwsh
      run: |
        $failed = $false
        Get-ChildItem -Path . -Recurse -Directory -Filter Locales | ForEach-Object {
          if (Test-Path (Join-Path $_.FullName 'zh-Hans.yml')) {
            $src = Split-Path $_.FullName -Parent
            pwsh -File ./check-locales.ps1 -LocaleDir $_.FullName -Baseline zh-Hans.yml -SourceDir $src
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
        }
        if ($failed) { exit 1 }
    - name: Check README languages
      shell: pwsh
      run: pwsh -File ./sync-readme-languages.ps1 -Check
