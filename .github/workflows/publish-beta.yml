name: publish-beta

on:
  push:
    branches: [ master ]
    paths:
        - 'NewLife.Audio/**'
  workflow_dispatch:

# 必须声明 packages: write，否则推送 GitHub Packages 会 403
# 必须声明 id-token: write，否则 NuGet Trusted Publishing 无法换取临时 API Key
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-publish:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          10.x
    - name: Build
      run: |
        dotnet pack --version-suffix $(date "+%Y.%m%d-beta%H%M") -c Release -o out NewLife.Audio/NewLife.Audio.csproj
    - name: Package consumer smoke
      # 下游只加 PackageReference 的端到端验证；失败即不发包
      shell: pwsh
      run: pwsh -NoProfile -File ./tools/check-package-consumer.ps1
    - name: API compatibility gate (observation mode)
      # 观察期：只报告不阻断；稳定后删除 continue-on-error 转为发布阻断。
      # 基线=最新已发布正式版，校验在 Publish 之前，不会被本次 beta 污染。
      continue-on-error: true
      shell: pwsh
      run: pwsh -NoProfile -File ./tools/check-api-compat.ps1
    - name: NuGet login (OIDC)
      # Trusted Publishing：用 GitHub OIDC 换取 1 小时有效的临时 Key，不再依赖长期 API Key
      # 需在 nuget.org 的 Trusted Publishing 中为本仓库的 publish-beta.yml 建立策略
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: NewLife
    - name: Publish
      run: |
        dotnet nuget push ./out/*.nupkg --skip-duplicate --source https://nuget.pkg.github.com/NewLifeX/index.json --api-key ${{ github.token }}
        dotnet nuget push ./out/*.nupkg --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
