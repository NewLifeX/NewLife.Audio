name: readme

on:
  push:
    branches: [ '*' ]
    paths:
      - 'README*.md'
      - 'readme-languages.json'
      - 'readme-metrics.json'
      - 'readme-package.json'
      - 'tools/sync-readme-languages.ps1'
      - 'tools/sync-readme-metrics.ps1'
      - 'tools/sync-readme-package.ps1'
      - '.github/workflows/readme.yml'
  pull_request:
    branches: [ '*' ]
    paths:
      - 'README*.md'
      - 'readme-languages.json'
      - 'readme-metrics.json'
      - 'readme-package.json'
      - 'tools/sync-readme-languages.ps1'
      - 'tools/sync-readme-metrics.ps1'
      - 'tools/sync-readme-package.ps1'
      - '.github/workflows/readme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  language-switcher:
    name: check readme
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4
    - name: Check README language switcher
      shell: pwsh
      run: pwsh -NoProfile -File ./tools/sync-readme-languages.ps1 -Check
    - name: Check README metrics
      shell: pwsh
      run: pwsh -NoProfile -File ./tools/sync-readme-metrics.ps1 -Check
    - name: Check README package copy
      shell: pwsh
      run: pwsh -NoProfile -File ./tools/sync-readme-package.ps1 -Check
