name: tfm-guard

# 目标框架清单守门：nupkg 的 lib/ 资产集合必须与约定集合完全一致。
# 多一个或少一个都失败——防止 EOL 目标被无意加回、或新增目标后忘记同步 README 与架构文档。
on:
  push:
    branches: [ '*' ]
    paths:
      - 'NewLife.Audio/NewLife.Audio.csproj'
      - '.github/workflows/tfm-guard.yml'
  pull_request:
    branches: [ '*' ]
    paths:
      - 'NewLife.Audio/NewLife.Audio.csproj'
      - '.github/workflows/tfm-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: lib 资产集合校验
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: 校验 lib 资产集合
      shell: pwsh
      run: |
        dotnet pack NewLife.Audio\NewLife.Audio.csproj -c Release -o out-tfm
        $zip = Get-ChildItem out-tfm\NewLife.Audio.*.nupkg | Sort-Object LastWriteTime -Descending | Select-Object -First 1
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
        $libs = $archive.Entries |
          Where-Object { $_.FullName -match '^lib/([^/]+)/NewLife\.Audio\.dll$' } |
          ForEach-Object { ($_.FullName -split '/')[1] }
        $archive.Dispose()

        $actual = $libs | Sort-Object -Unique
        $expected = @('net461', 'netstandard2.0', 'netstandard2.1') | Sort-Object

        Write-Host "实际资产：$($actual -join ', ')"
        $missing = $expected | Where-Object { $actual -notcontains $_ }
        $extra = $actual | Where-Object { $expected -notcontains $_ }
        if ($missing) { throw "缺少约定的目标框架资产：$($missing -join ', ')" }
        if ($extra) { throw "出现未约定的目标框架资产：$($extra -join ', ')（确认要新增时，请同步更新本工作流的 expected、README 数量与架构设计决策表）" }
        Write-Host "TFM 资产校验通过：$($actual.Count) 个"
